<!DOCTYPE html>
<html>
<head>
  <title>Test Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    h1 {
      color: #333;
    }
    .button {
      display: inline-block;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Test Page</h1>
    <p>If you can see this page, GitHub Pages is working correctly.</p>
    <p>This is a test to verify that GitHub Pages is properly serving files from your repository.</p>
    <a href="index.html" class="button">Go to Flutter App</a>
    
    <div id="debug">
      <h2>Debug Info:</h2>
      <p>Base URL: <span id="baseUrl"></span></p>
      <p>Current Path: <span id="currentPath"></span></p>
    </div>
    
    <script>
      // Display debug info
      document.getElementById('baseUrl').textContent = window.location.origin + window.location.pathname.replace('test.html', '');
      document.getElementById('currentPath').textContent = window.location.pathname;
    </script>
  </div>
</body>
</html>
