<!DOCTYPE html>
<html>
<head>
  <base href="/flutter_ar_ecommerce/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AR Furniture Shop">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_ar_ecommerce">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AR Furniture Shop</title>
  <link rel="manifest" href="manifest.json">

  <!-- Model viewer script -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.0.0/model-viewer.min.js"></script>
  
  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "42420029";
    
    // Debug model-viewer
    window.addEventListener('DOMContentLoaded', function() {
      console.log('DOM content loaded');
      document.addEventListener('model-viewer-load', function(e) {
        console.log('Model loaded:', e.target.src);
      });
      
      document.addEventListener('model-viewer-error', function(e) {
        console.error('Model error:', e.detail);
      });
    });
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  <style>
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-left-color: #9c27b0;
      border-radius: 50%;
      animation: spinner 1s linear infinite;
    }
    @keyframes spinner {
      to {transform: rotate(360deg);}
    }
    .error-message {
      background-color: #f8d7da;
      color: #721c24;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #f5c6cb;
      border-radius: 4px;
      width: 80%;
      max-width: 500px;
      text-align: center;
    }
    .debug-link {
      display: inline-block;
      margin-top: 15px;
      color: #007bff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div style="text-align: center;">
      <div class="spinner"></div>
      <p style="margin-top: 10px;">Loading AR Furniture Shop...</p>
      <div id="error-container"></div>
    </div>
  </div>
  <script>
    window.addEventListener('load', function(ev) {
      console.log('Window loaded');
      // Download main.dart.js
      var loading = document.querySelector('#loading');
      var errorContainer = document.getElementById('error-container');
      
      // Set a timeout to show a fallback UI if Flutter doesn't load in 10 seconds
      var loadingTimeout = setTimeout(function() {
        showError('Flutter app is taking too long to load. Try refreshing the page or check the diagnostic page.');
      }, 10000);
      
      function showError(message) {
        console.error(message);
        var errorDiv = document.createElement('div');
        errorDiv.className = 'error-message';
        errorDiv.innerHTML = message + 
          '<br><a href="flutter-test.html" class="debug-link">View Diagnostic Page</a>';
        errorContainer.appendChild(errorDiv);
      }
      
      // Detect if main.dart.js exists
      fetch('main.dart.js')
        .then(response => {
          if (!response.ok) {
            showError('Could not load Flutter app (main.dart.js not found)');
          } else {
            console.log('main.dart.js found, size:', response.headers.get('content-length'));
          }
        })
        .catch(error => {
          showError('Network issue loading Flutter app: ' + error.message);
        });
      
      // Load Flutter app
      try {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
          onEntrypointLoaded: function(engineInitializer) {
            console.log('Entrypoint loaded');
            engineInitializer.initializeEngine().then(function(appRunner) {
              console.log('Engine initialized');
              loading.style.display = 'none';
              appRunner.runApp();
              console.log('App started');
              // Clear the timeout when app loads successfully
              clearTimeout(loadingTimeout);
            }).catch(function(error) {
              console.error('Failed to initialize engine', error);
              showError('Failed to initialize Flutter engine: ' + error.message);
            });
          }
        }).catch(function(error) {
          console.error('Failed to load entrypoint', error);
          showError('Failed to load Flutter entrypoint: ' + error.message);
        });
      } catch (error) {
        console.error('Error loading Flutter', error);
        showError('Error loading Flutter: ' + error.message);
      }
    });
  </script>
</body>
</html>
